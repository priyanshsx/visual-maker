[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-maker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jinja2",
    "pyyaml",
    "pydantic>=2",
    "playwright",
    "pillow",
    "python-dotenv",
    "openai",
    "anthropic",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["visuals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
