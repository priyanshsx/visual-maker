# Draft from the idea command, 2026-11-26: review before rendering.
# Client: quartermaster | bucket: feature_launch (Product / feature launch or upgrade) | video | template: device_demo
# Idea: Announce the new Correlations page in Quartermaster. It shows each asset's rolling 52-week correlation with Bitcoin, with S&P 500, Apple and gold on one chart. Free at app.quartermasterlabs.com

- name: correlations-page-launch-2
  sizes:
  - portrait
  - landscape
  template: device_demo
  kicker: New in Quartermaster
  title: 'Correlations page: each asset against *Bitcoin*'
  image: correlations-chart.png
  steps:
  - caption: 'Each line is one asset: S&P500, Apple and Gold.'
    focus:
    - 0.16
    - 0.2
    zoom: 1.5
    marker: false
  - caption: The green Gold line climbs to its highest point on the chart.
    focus:
    - 0.4
    - 0.43
    zoom: 2.0
    marker: false
  - caption: The zero line means no correlation with Bitcoin.
    focus:
    - 0.9
    - 0.59
    zoom: 2.0
    marker: true
  cta: Find it free at app.quartermasterlabs.com
  look: cinematic
  text_style: plain
